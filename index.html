<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>P74 Tools</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />

    <link rel="icon" href="icon.ico" />

    <style>
    /* ── reset & base ── */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        font-size: 16px;
        --bg: #000000;
        --fg: #f0f0f0;
        --dim: #666666;
        --prompt: #33ff33;
        --border: #222222;
        --dot-red: #ff5f56;
    }

    html {
        height: 100%;
        overflow: hidden;
        background: var(--bg);
    }

    /*
     * The body is pinned to the *visible* viewport. --vv-h and --vv-top are
     * kept up to date by the script (window.visualViewport), so when a mobile
     * keyboard opens the terminal shrinks to the space above it and its top
     * and bottom edges stay on the edges of what the user can see.
     * Before the script runs (or without visualViewport) it falls back to the
     * whole dynamic viewport.
     */
    body {
        position: fixed;
        left: 0;
        right: 0;
        top: var(--vv-top, 0px);
        height: var(--vv-h, 100dvh);
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Share Tech Mono', monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2vw;
        margin: 0;
    }

    /* ── terminal window ── */
    .terminal {
        width: 100%;
        max-width: 840px;
        height: 90%;
        max-height: 700px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* ── title bar ── */
    .titlebar {
        display: flex;
        align-items: center;
        padding: 0.7rem 1.2rem;
        background: #0a0a0a;
        border-bottom: 1px solid var(--border);
        user-select: none;
        flex-shrink: 0;
    }

    .titlebar .label {
        font-size: 0.8rem;
        color: var(--dim);
        letter-spacing: 0.04em;
        opacity: 0.7;
        font-family: 'Share Tech Mono', monospace;
    }

    .dots {
        display: flex;
        gap: 0.55rem;
        margin-left: auto;
        flex-shrink: 0;
    }

    .dot {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        display: block;
        flex-shrink: 0;
    }
    /* the red dot is a real button: it closes the tab, same as `exit` */
    button.dot {
        border: none;
        padding: 0;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }
    .dot.red {
        position: relative;
        background: var(--dot-red);
    }
    /* invisible, larger touch target around the small dot */
    .dot.red::after {
        content: '';
        position: absolute;
        inset: -10px;
    }
    .dot.red:hover {
        filter: brightness(1.15);
    }
    .dot.red:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
    }

    /* ── output area ── */
    .output {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 0.5rem 1.5rem 0.2rem 1.5rem;
        background: var(--bg);
        font-size: 1rem;
        line-height: 1.6;
        scroll-behavior: smooth;
    }

    .output::-webkit-scrollbar {
        width: 6px;
    }
    .output::-webkit-scrollbar-track {
        background: transparent;
    }
    .output::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
    }
    .output::-webkit-scrollbar-thumb:hover {
        background: var(--dim);
    }

    /* ── welcome message / inline links ── */
    .output a {
        color: var(--fg);
        text-decoration: underline;
        text-underline-offset: 0.15em;
    }

    .output a:hover {
        color: var(--prompt);
    }

    .output .hl {
        color: var(--prompt);
    }

    /* ── dynamic lines ── */
    .output .line {
        white-space: pre-wrap;
        word-break: break-word;
        padding: 0.05rem 0;
    }

    /* empty lines (spacers in `help`) still need a line box to have height */
    .output .line:empty::after {
        content: '\00a0';
    }

    .output .line.prompt-line {
        color: var(--fg);
    }

    .output .line.prompt-line .prompt-symbol {
        color: var(--prompt);
    }

    .output .line.output-line {
        color: var(--fg);
        padding-left: 0.5rem;
    }

    .output .line.output-line.dim {
        color: var(--dim);
    }

    .output .line.output-line.error {
        color: #ff6b6b;
    }

    .output .line.output-line.success {
        color: var(--prompt);
    }

    .output .line.output-line.help {
        color: var(--fg);
    }

    .output .line.output-line.help .cmd-name {
        color: #66d9ff;
    }

    .output .line.output-line.help .cmd-desc {
        color: var(--dim);
    }

    /* the actual apps in `help` (name and description) are bold */
    .output .line.output-line.help.app {
        font-weight: bold;
    }

    /* ── input line ── */
    .input-line {
        display: flex;
        align-items: center;
        padding: 0.6rem 1.5rem 1.2rem 1.5rem;
        background: var(--bg);
        border-top: 1px solid var(--border);
        flex-shrink: 0;
        gap: 0.6rem;
    }

    /* 16px minimum: iOS Safari zooms the whole page when an input below
       16px gets focus, which is another way the terminal ended up clipped */
    .input-line .prompt {
        color: var(--prompt);
        font-size: max(16px, 1rem);
        font-family: 'Share Tech Mono', monospace;
        flex-shrink: 0;
    }

    .input-line #command-input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--fg);
        font-family: 'Share Tech Mono', monospace;
        font-size: max(16px, 1rem);
        padding: 0.1rem 0;
        caret-color: var(--prompt);
        min-width: 0;
    }

    .input-line #command-input::selection {
        background: rgba(51, 255, 51, 0.25);
    }

    /* ── responsive ── */
    @media (max-width: 640px) {
        :root {
            font-size: 14px;
        }
        /* The terminal's top and bottom edges sit on the top and bottom of the
           visible page; only the sides keep a margin. Safe-area insets keep it
           clear of notches / the home indicator, and the bottom one is dropped
           while the keyboard is open (the keyboard covers that area anyway). */
        body {
            padding: env(safe-area-inset-top) calc(3vw + env(safe-area-inset-right)) env(safe-area-inset-bottom) calc(3vw + env(safe-area-inset-left));
            align-items: stretch;
        }
        html.kb-open body {
            padding-bottom: 0;
        }
        .terminal {
            height: 100%;
            max-height: none;
            border-radius: 8px;
        }
        .output {
            padding: 0.3rem 1rem 0.2rem 1rem;
        }
        .input-line {
            padding: 0.4rem 1rem 0.8rem 1rem;
        }
        html.kb-open .input-line {
            padding-bottom: 0.5rem;
        }
        .titlebar {
            padding: 0.5rem 0.8rem;
        }
        .dot {
            width: 10px;
            height: 10px;
        }
        .titlebar .label {
            font-size: 0.65rem;
        }
    }

    @media (max-width: 400px) {
        :root {
            font-size: 12px;
        }
        body {
            padding-left: calc(2.5vw + env(safe-area-inset-left));
            padding-right: calc(2.5vw + env(safe-area-inset-right));
        }
        .terminal {
            border-radius: 6px;
        }
        .output {
            padding: 0.2rem 0.6rem 0.2rem 0.6rem;
        }
        .input-line {
            padding: 0.3rem 0.6rem 0.6rem 0.6rem;
        }
    }

    @media print {
        html,
        body {
            height: auto;
            overflow: visible;
        }
        body {
            position: static;
            background: white;
            padding: 1rem;
        }
        .terminal {
            border-color: #ccc;
            box-shadow: none;
            height: auto;
            max-height: none;
            border-radius: 4px;
        }
        .titlebar {
            background: #eee;
            border-color: #ccc;
        }
        .titlebar .label {
            color: #555;
        }
        .dot {
            border: 1px solid #999;
            background: #ccc !important;
        }
        .output {
            background: white;
            color: black;
            overflow: visible;
            padding: 1rem;
        }
        .output .line {
            color: black !important;
        }
        .output .line.prompt-line .prompt-symbol {
            color: #006600 !important;
        }
        .output a {
            color: #0055aa;
        }
        .output .hl {
            color: #006600;
        }
        .output .line.output-line.dim {
            color: #555 !important;
        }
        .output .line.output-line.error {
            color: #cc0000 !important;
        }
        .output .line.output-line.success {
            color: #006600 !important;
        }
        .output .line.output-line.help .cmd-name {
            color: #0055aa !important;
        }
        .output .line.output-line.help .cmd-desc {
            color: #555 !important;
        }
        .input-line {
            border-color: #ccc;
            background: white;
            padding: 0.5rem 1rem;
        }
        .input-line .prompt {
            color: #006600 !important;
        }
        .input-line #command-input {
            color: black;
            caret-color: black;
        }
        .input-line #command-input::selection {
            background: #ccc;
        }
    }
    </style>
</head>

<body>

    <div class="terminal" id="terminal">

        <!-- title bar -->
        <div class="titlebar">
            <span class="label">p74-tools</span>
            <span class="dots">
                <button type="button" class="dot red" id="close-btn" aria-label="Close tab" title="Close tab"></button>
            </span>
        </div>

        <!-- output -->
        <div class="output" id="output"></div>

        <!-- input line -->
        <div class="input-line">
            <span class="prompt">$</span>
            <input type="text" id="command-input" autofocus autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" />
        </div>

    </div>

    <script>
        (function() {
            // ── DOM refs ──
            const root = document.documentElement;
            const terminal = document.getElementById('terminal');
            const output = document.getElementById('output');
            const input = document.getElementById('command-input');

            // ── state ──
            const cmdHistory = [];
            let historyIndex = -1;

            // ── visible viewport (mobile keyboard) ──
            // The layout viewport does not shrink when a mobile keyboard opens
            // (iOS never, Android Chrome by default), so 100vh-based sizing ends
            // up partly behind the keyboard. Instead the page is pinned to the
            // visual viewport: --vv-h is the visible height, --vv-top the
            // distance the browser has scrolled the visible area down.
            const vv = window.visualViewport;

            function syncViewport() {
                const h = vv ? vv.height : window.innerHeight;
                const top = vv ? vv.offsetTop : 0;
                root.style.setProperty('--vv-h', h + 'px');
                root.style.setProperty('--vv-top', top + 'px');
                root.classList.toggle('kb-open', window.innerHeight - h > 120);
                scrollToBottom();
            }

            if (vv) {
                vv.addEventListener('resize', syncViewport);
                vv.addEventListener('scroll', syncViewport);
            }
            window.addEventListener('resize', syncViewport);
            window.addEventListener('orientationchange', syncViewport);

            // ── helpers ──
            function escapeHtml(str) {
                return String(str).replace(/[&<>"']/g, ch => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[ch]));
            }

            function scrollToBottom() {
                output.scrollTop = output.scrollHeight;
            }

            // `html` is trusted markup. Anything the user typed must go through
            // escapeHtml() before it gets here.
            function appendLine(html, className = '') {
                const div = document.createElement('div');
                div.className = 'line ' + className;
                div.innerHTML = html;
                output.appendChild(div);
                scrollToBottom();
            }

            function appendOutput(html, className = 'output-line') {
                appendLine(html, className);
            }

            function appendPrompt(cmd) {
                appendLine(`<span class="prompt-symbol">$</span> ${escapeHtml(cmd)}`, 'prompt-line');
            }

            // ── welcome message ──
            function showWelcome() {
                appendLine('01001010 Tools');
                appendLine('By <a href="https://p74.ir" target="_blank" rel="noopener noreferrer">Pouyan</a>');
                appendLine('');
                appendLine('Enter <span class="hl">help</span> for all commands');
                appendLine('');
            }

            // Like a real terminal, clearing wipes everything, welcome included.
            function clearScreen() {
                output.innerHTML = '';
                scrollToBottom();
            }

            // ── exit (the `exit` command and the red button) ──
            function exitTerminal() {
                appendOutput('→ closing tab …', 'output-line dim');
                setTimeout(() => {
                    // window.close() does not throw when the browser
                    // refuses (tab not opened by a script), it just
                    // does nothing – so check whether we're still here.
                    try {
                        window.close();
                    } catch (_) {}
                    setTimeout(() => {
                        if (!window.closed) {
                            appendOutput('⚠️  Cannot close tab programmatically. Please close it manually (Ctrl+W / Cmd+W).',
                                'output-line error');
                        }
                    }, 200);
                }, 200);
            }

            document.getElementById('close-btn').addEventListener('click', exitTerminal);

            // ── navigation commands ──
            // A Map (not a plain object): looking up "constructor", "toString"
            // etc. in an object literal finds inherited members and would
            // send the page to a function instead of printing "command not found".
            const NAV_COMMANDS = new Map([
                ['matrix', 'matrix.html'],
                ['datetime', 'datetime.html'],
                ['time-converter', 'datetime-converter.html'],
                ['duodecimal', 'duodecimal.html'],
                ['chronograph', 'chronograph.html'],
                ['watch', 'watch.html']
            ]);

            // ── command logic ──
            function processCommand(cmd) {
                const trimmed = cmd.trim();

                if (trimmed === '') {
                    appendPrompt('');
                    return;
                }

                appendPrompt(trimmed);

                const lower = trimmed.toLowerCase();

                // cat (alone or with arguments)
                if (lower === 'cat' || lower.startsWith('cat ')) {
                    appendOutput('Meow', 'output-line');
                    return;
                }

                // touch (alone or with arguments)
                if (lower === 'touch' || lower.startsWith('touch ')) {
                    appendOutput('permission denied', 'output-line error');
                    return;
                }

                // uname (exact match only)
                if (lower === 'uname') {
                    appendOutput('P74', 'output-line');
                    return;
                }

                // whoami (exact match only)
                if (lower === 'whoami') {
                    appendOutput('Pouyan', 'output-line');
                    return;
                }

                // man / woman (alone or with an argument): each points at the other
                const manMatch = /^(man|woman)(?:\s+(.+))?$/i.exec(trimmed);
                if (manMatch) {
                    const other = manMatch[1].toLowerCase() === 'man' ? 'woman' : 'man';
                    const arg = manMatch[2] ? ' ' + escapeHtml(manMatch[2]) : '';
                    appendOutput(`= ${other}${arg}`, 'output-line');
                    return;
                }

                // Navigation commands – redirect immediately
                if (NAV_COMMANDS.has(lower)) {
                    window.location.href = NAV_COMMANDS.get(lower);
                    return;
                }

                // System / easter egg commands
                switch (lower) {
                    case 'exit':
                        exitTerminal();
                        break;

                    case 'help':
                        appendOutput('', '');
                        appendOutput('Available commands:', 'output-line help');
                        appendOutput('  <span class="cmd-name">matrix</span>            <span class="cmd-desc">Polylingual Matrix Rain</span>',
                            'output-line help app');
                        appendOutput('  <span class="cmd-name">datetime</span>          <span class="cmd-desc">Decimal Clock</span>',
                            'output-line help app');
                        appendOutput('  <span class="cmd-name">time-converter</span>    <span class="cmd-desc">Time Converter</span>',
                            'output-line help app');
                        appendOutput('  <span class="cmd-name">duodecimal</span>        <span class="cmd-desc">Duodecimal Converter</span>',
                            'output-line help app');
                        appendOutput('  <span class="cmd-name">chronograph</span>       <span class="cmd-desc">Chronograph</span>',
                            'output-line help app');
                        appendOutput('  <span class="cmd-name">watch</span>             <span class="cmd-desc">My dream wristwatch</span>',
                            'output-line help app');
                        appendOutput('  <span class="cmd-name">cat</span>               <span class="cmd-desc">Concatenate files</span>',
                            'output-line help');
                        appendOutput('  <span class="cmd-name">man</span>               <span class="cmd-desc">Reference manuals</span>',
                            'output-line help');
                        appendOutput('  <span class="cmd-name">touch</span>             <span class="cmd-desc">Change file timestamps</span>',
                            'output-line help');
                        appendOutput('  <span class="cmd-name">uname</span>             <span class="cmd-desc">Print system name</span>',
                            'output-line help');
                        appendOutput('  <span class="cmd-name">whoami</span>            <span class="cmd-desc">Print current user</span>',
                            'output-line help');
                        appendOutput('  <span class="cmd-name">clear</span>             <span class="cmd-desc">Clear the terminal screen</span>',
                            'output-line help');
                        appendOutput('  <span class="cmd-name">clr</span>               <span class="cmd-desc">Alias for clear</span>',
                            'output-line help');
                        appendOutput('  <span class="cmd-name">exit</span>              <span class="cmd-desc">Close the tab</span>',
                            'output-line help');
                        appendOutput('  <span class="cmd-name">help</span>              <span class="cmd-desc">Show this help</span>',
                            'output-line help');
                        appendOutput('  <span class="cmd-name">pwd</span>               <span class="cmd-desc">Print working directory</span>',
                            'output-line help');
                        appendOutput('  <span class="cmd-name">ls</span>                <span class="cmd-desc">List directory contents</span>',
                            'output-line help');
                        appendOutput('  <span class="cmd-name">cd</span>                <span class="cmd-desc">Change directory</span>',
                            'output-line help');
                        appendOutput('', '');
                        break;

                    case 'clear':
                    case 'clr':
                        clearScreen();
                        break;

                    case 'pwd':
                        appendOutput('/ir/01001010/index', 'output-line dim');
                        break;

                    case 'ls':
                    case 'cd':
                        appendOutput('permission denied', 'output-line error');
                        break;

                    default:
                        appendOutput(`"${escapeHtml(trimmed)}": command not found`, 'output-line error');
                        break;
                }
            }

            // ── input handling ──
            function handleSubmit() {
                const cmd = input.value;

                if (cmd.trim() !== '') {
                    cmdHistory.push(cmd);
                }

                input.value = '';
                processCommand(cmd);
                historyIndex = cmdHistory.length;
            }

            // ── keyboard events ──
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSubmit();
                    return;
                }

                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (cmdHistory.length === 0) return;
                    if (historyIndex > 0) {
                        historyIndex--;
                        input.value = cmdHistory[historyIndex];
                    }
                    setTimeout(() => {
                        input.selectionStart = input.selectionEnd = input.value.length;
                    }, 0);
                    return;
                }

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (cmdHistory.length === 0) return;
                    if (historyIndex < cmdHistory.length - 1) {
                        historyIndex++;
                        input.value = cmdHistory[historyIndex];
                    } else {
                        historyIndex = cmdHistory.length;
                        input.value = '';
                    }
                    setTimeout(() => {
                        input.selectionStart = input.selectionEnd = input.value.length;
                    }, 0);
                    return;
                }

                // Ctrl+L / Cmd+L → clear
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l') {
                    e.preventDefault();
                    clearScreen();
                }
            });

            // ── focus management ──
            // Clicking the terminal puts the cursor in the prompt, like a real
            // terminal – except on links (so they stay usable) and while text
            // is being selected (so it can be copied). There is deliberately no
            // blur handler: forcing focus back made Tab, text selection and
            // dismissing the mobile keyboard impossible.
            terminal.addEventListener('click', function(e) {
                if (e.target.closest('a')) return;
                const sel = window.getSelection();
                if (sel && sel.toString() !== '') return;
                input.focus({ preventScroll: true });
            });

            // ── init ──
            syncViewport();
            showWelcome();

            setTimeout(() => {
                input.focus({ preventScroll: true });
            }, 100);

            console.log('⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯');
            console.log('  P74 Tools terminal active');
            console.log('  Type "help" for commands · "clear" to clear');
            console.log('⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯');

        })();
    </script>

</body>

</html>
