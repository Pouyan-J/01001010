<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>P74 Tools</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />

    <link rel="icon" href="icon.ico" />

    <style>
    /* ── reset & base ── */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        font-size: 16px;
        --bg: #000000;
        --fg: #f0f0f0;
        --dim: #666666;
        --prompt: #33ff33;
        --border: #222222;
        --dot-red: #ff5f56;
        /* one font size for everything typed and printed in the terminal */
        --term-font: 1rem;
        /* margin between the terminal and the edges of the page (phones) */
        --edge: 3vw;
    }

    html {
        height: 100%;
        overflow: hidden;
        background: var(--bg);
    }

    /*
     * The body is pinned to the *visible* viewport. --vv-h and --vv-top are
     * kept up to date by the script (window.visualViewport), so when a mobile
     * keyboard opens the terminal shrinks to the space above it and its top
     * and bottom edges stay on the edges of what the user can see.
     * Before the script runs (or without visualViewport) it falls back to the
     * whole dynamic viewport.
     */
    body {
        position: fixed;
        left: 0;
        right: 0;
        top: var(--vv-top, 0px);
        height: var(--vv-h, 100dvh);
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Share Tech Mono', monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2vw;
        margin: 0;
    }

    /* ── terminal window ── */
    .terminal {
        width: 100%;
        max-width: 840px;
        height: 90%;
        max-height: 700px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* ── title bar ── */
    .titlebar {
        display: flex;
        align-items: center;
        padding: 0.7rem 1.2rem;
        background: #0a0a0a;
        border-bottom: 1px solid var(--border);
        user-select: none;
        flex-shrink: 0;
    }

    .titlebar .label {
        font-size: 0.8rem;
        color: var(--dim);
        letter-spacing: 0.04em;
        opacity: 0.7;
        font-family: 'Share Tech Mono', monospace;
    }

    .dots {
        display: flex;
        gap: 0.55rem;
        margin-left: auto;
        flex-shrink: 0;
    }

    .dot {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        display: block;
        flex-shrink: 0;
    }
    /* the red dot is a real button: it closes the tab, same as `exit` */
    button.dot {
        border: none;
        padding: 0;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }
    .dot.red {
        position: relative;
        background: var(--dot-red);
    }
    /* invisible, larger touch target around the small dot */
    .dot.red::after {
        content: '';
        position: absolute;
        inset: -10px;
    }
    .dot.red:hover {
        filter: brightness(1.15);
    }
    .dot.red:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
    }

    /* ── output area ── */
    .output {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 0.5rem 1.5rem 0.2rem 1.5rem;
        background: var(--bg);
        font-size: var(--term-font);
        line-height: 1.6;
        scroll-behavior: smooth;
    }

    .output::-webkit-scrollbar {
        width: 6px;
    }
    .output::-webkit-scrollbar-track {
        background: transparent;
    }
    .output::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
    }
    .output::-webkit-scrollbar-thumb:hover {
        background: var(--dim);
    }

    /* ── welcome message / inline links ── */
    .output a {
        color: var(--fg);
        text-decoration: underline;
        text-underline-offset: 0.15em;
    }

    .output a:hover {
        color: var(--prompt);
    }

    .output .hl {
        color: var(--prompt);
    }

    /* ── dynamic lines ── */
    .output .line {
        white-space: pre-wrap;
        word-break: break-word;
        padding: 0.05rem 0;
    }

    /* empty lines (spacers in `help`) still need a line box to have height */
    .output .line:empty::after {
        content: '\00a0';
    }

    .output .line.prompt-line {
        color: var(--fg);
    }

    .output .line.prompt-line .prompt-symbol {
        color: var(--prompt);
    }

    .output .line.output-line {
        color: var(--fg);
        padding-left: 0.5rem;
    }

    .output .line.output-line.dim {
        color: var(--dim);
    }

    .output .line.output-line.error {
        color: #ff6b6b;
    }

    .output .line.output-line.success {
        color: var(--prompt);
    }

    .output .line.output-line.help {
        color: var(--fg);
    }

    .output .line.output-line.help .cmd-name {
        color: #66d9ff;
    }

    .output .line.output-line.help .cmd-desc {
        color: var(--dim);
    }

    /* the actual apps in `help` (name and description) are bold */
    .output .line.output-line.help.app {
        font-weight: bold;
    }

    /* help entries are clickable: they type the command into the prompt */
    .output .line[data-cmd] {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }
    .output .line[data-cmd]:hover .cmd-name {
        color: var(--prompt);
        text-decoration: underline;
        text-underline-offset: 0.15em;
    }

    /* ── input line ── */
    .input-line {
        display: flex;
        align-items: center;
        padding: 0.6rem 1.5rem 1.2rem 1.5rem;
        background: var(--bg);
        border-top: 1px solid var(--border);
        flex-shrink: 0;
        gap: 0.6rem;
    }

    /* The prompt and the input use the same size as the output text.
       On phones that size is 16px: iOS Safari zooms the whole page when an
       input below 16px gets focus, so the whole terminal uses 16px there. */
    .input-line .prompt {
        color: var(--prompt);
        font-size: var(--term-font);
        font-family: 'Share Tech Mono', monospace;
        flex-shrink: 0;
    }

    /* input + autocomplete suggestion ("ghost" text) share one box */
    .input-wrap {
        position: relative;
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
    }

    .input-line #command-input {
        position: relative;
        z-index: 1;
        flex: 1;
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: var(--fg);
        font-family: 'Share Tech Mono', monospace;
        font-size: var(--term-font);
        padding: 0.1rem 0;
        caret-color: var(--prompt);
        min-width: 0;
    }

    .input-line #command-input::selection {
        background: rgba(51, 255, 51, 0.25);
    }

    /* Sits exactly behind the input, same font and metrics. The part that is
       already typed is invisible (it only takes up the space), the rest of the
       suggested command is shown dimmed. */
    .ghost {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        overflow: hidden;
        white-space: pre;
        pointer-events: none;
        user-select: none;
        font-family: 'Share Tech Mono', monospace;
        font-size: var(--term-font);
        padding: 0.1rem 0;
        color: var(--dim);
    }
    .ghost .ghost-typed {
        visibility: hidden;
    }

    /* ── responsive ── */
    @media (max-width: 640px) {
        :root {
            font-size: 14px;
            --term-font: 16px;
        }
        /* A small margin (--edge) on all four sides. Where a notch or the
           home indicator needs more room, the safe-area inset wins. */
        body {
            padding:
                max(env(safe-area-inset-top), var(--edge))
                max(env(safe-area-inset-right), var(--edge))
                max(env(safe-area-inset-bottom), var(--edge))
                max(env(safe-area-inset-left), var(--edge));
            align-items: stretch;
        }
        /* While typing on a phone the keyboard covers the bottom of the screen
           (and the home indicator), so only the small margin is kept there.
           html.typing is set from the input's focus state, so this does not
           depend on measuring the viewport. */
        html.kb-open body,
        html.typing body {
            padding-bottom: var(--edge);
        }
        .terminal {
            height: 100%;
            max-height: none;
            border-radius: 8px;
        }
        .output {
            padding: 0.3rem 1rem 0.2rem 1rem;
        }
        .input-line {
            padding: 0.4rem 1rem 0.8rem 1rem;
        }
        html.kb-open .input-line,
        html.typing .input-line {
            padding-bottom: 0.5rem;
        }
        .titlebar {
            padding: 0.5rem 0.8rem;
        }
        .dot {
            width: 10px;
            height: 10px;
        }
        .titlebar .label {
            font-size: 0.65rem;
        }
    }

    @media (max-width: 400px) {
        :root {
            font-size: 12px;
            --edge: 2.5vw;
        }
        .terminal {
            border-radius: 6px;
        }
        .output {
            padding: 0.2rem 0.6rem 0.2rem 0.6rem;
        }
        .input-line {
            padding: 0.3rem 0.6rem 0.6rem 0.6rem;
        }
    }

    @media print {
        html,
        body {
            height: auto;
            overflow: visible;
        }
        body {
            position: static;
            background: white;
            padding: 1rem;
        }
        .terminal {
            border-color: #ccc;
            box-shadow: none;
            height: auto;
            max-height: none;
            border-radius: 4px;
        }
        .titlebar {
            background: #eee;
            border-color: #ccc;
        }
        .titlebar .label {
            color: #555;
        }
        .dot {
            border: 1px solid #999;
            background: #ccc !important;
        }
        .output {
            background: white;
            color: black;
            overflow: visible;
            padding: 1rem;
        }
        .output .line {
            color: black !important;
        }
        .output .line.prompt-line .prompt-symbol {
            color: #006600 !important;
        }
        .output a {
            color: #0055aa;
        }
        .output .hl {
            color: #006600;
        }
        .output .line.output-line.dim {
            color: #555 !important;
        }
        .output .line.output-line.error {
            color: #cc0000 !important;
        }
        .output .line.output-line.success {
            color: #006600 !important;
        }
        .output .line.output-line.help .cmd-name {
            color: #0055aa !important;
        }
        .output .line.output-line.help .cmd-desc {
            color: #555 !important;
        }
        .ghost {
            display: none;
        }
        .input-line {
            border-color: #ccc;
            background: white;
            padding: 0.5rem 1rem;
        }
        .input-line .prompt {
            color: #006600 !important;
        }
        .input-line #command-input {
            color: black;
            caret-color: black;
        }
        .input-line #command-input::selection {
            background: #ccc;
        }
    }
    </style>
</head>

<body>

    <div class="terminal" id="terminal">

        <!-- title bar -->
        <div class="titlebar">
            <span class="label">p74-tools</span>
            <span class="dots">
                <button type="button" class="dot red" id="close-btn" aria-label="Close tab" title="Close tab"></button>
            </span>
        </div>

        <!-- output -->
        <div class="output" id="output"></div>

        <!-- input line -->
        <div class="input-line">
            <span class="prompt">$</span>
            <div class="input-wrap">
                <span class="ghost" id="ghost" aria-hidden="true"><span class="ghost-typed" id="ghost-typed"></span><span class="ghost-rest" id="ghost-rest"></span></span>
                <input type="text" id="command-input" autofocus autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" />
            </div>
        </div>

    </div>

    <script>
        (function() {
            // ── DOM refs ──
            const root = document.documentElement;
            const terminal = document.getElementById('terminal');
            const output = document.getElementById('output');
            const input = document.getElementById('command-input');
            const ghost = document.getElementById('ghost');
            const ghostTyped = document.getElementById('ghost-typed');
            const ghostRest = document.getElementById('ghost-rest');

            // ── state ──
            const cmdHistory = [];
            let historyIndex = -1;

            // ── visible viewport (mobile keyboard) ──
            // The layout viewport does not shrink when a mobile keyboard opens
            // (iOS never, Android Chrome by default), so 100vh-based sizing ends
            // up partly behind the keyboard. Instead the page is pinned to the
            // visual viewport: --vv-h is the visible height, --vv-top the
            // distance the browser has scrolled the visible area down.
            const vv = window.visualViewport;

            function syncViewport() {
                const h = vv ? vv.height : window.innerHeight;
                const top = vv ? vv.offsetTop : 0;
                root.style.setProperty('--vv-h', h + 'px');
                root.style.setProperty('--vv-top', top + 'px');
                root.classList.toggle('kb-open', window.innerHeight - h > 120);
                scrollToBottom();
            }

            if (vv) {
                vv.addEventListener('resize', syncViewport);
                vv.addEventListener('scroll', syncViewport);
            }
            window.addEventListener('resize', syncViewport);
            window.addEventListener('orientationchange', syncViewport);

            // ── helpers ──
            function escapeHtml(str) {
                return String(str).replace(/[&<>"']/g, ch => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[ch]));
            }

            function scrollToBottom() {
                output.scrollTop = output.scrollHeight;
            }

            // `html` is trusted markup. Anything the user typed must go through
            // escapeHtml() before it gets here.
            function appendLine(html, className = '') {
                const div = document.createElement('div');
                div.className = 'line ' + className;
                div.innerHTML = html;
                output.appendChild(div);
                scrollToBottom();
                return div;
            }

            function appendOutput(html, className = 'output-line') {
                return appendLine(html, className);
            }

            function appendPrompt(cmd) {
                appendLine(`<span class="prompt-symbol">$</span> ${escapeHtml(cmd)}`, 'prompt-line');
            }

            // ── welcome message ──
            function showWelcome() {
                appendLine('01001010 Tools');
                appendLine('By <a href="https://p74.ir" target="_blank" rel="noopener noreferrer">Pouyan</a>');
                appendLine('');
                appendLine('Enter <span class="hl">help</span> for all commands');
                appendLine('');
            }

            // Like a real terminal, clearing wipes everything, welcome included.
            function clearScreen() {
                output.innerHTML = '';
                scrollToBottom();
            }

            // ── exit (the `exit` command and the red button) ──
            function exitTerminal() {
                appendOutput('→ closing tab …', 'output-line dim');
                setTimeout(() => {
                    // window.close() does not throw when the browser
                    // refuses (tab not opened by a script), it just
                    // does nothing – so check whether we're still here.
                    try {
                        window.close();
                    } catch (_) {}
                    setTimeout(() => {
                        if (!window.closed) {
                            appendOutput('⚠️  Cannot close tab programmatically. Please close it manually (Ctrl+W / Cmd+W).',
                                'output-line error');
                        }
                    }, 200);
                }, 200);
            }

            document.getElementById('close-btn').addEventListener('click', exitTerminal);

            // ── navigation commands ──
            // A Map (not a plain object): looking up "constructor", "toString"
            // etc. in an object literal finds inherited members and would
            // open a function instead of printing "command not found".
            const NAV_COMMANDS = new Map([
                ['matrix', 'matrix.html'],
                ['datetime', 'datetime.html'],
                ['time-converter', 'datetime-converter.html'],
                ['duodecimal', 'duodecimal.html'],
                ['chronograph', 'chronograph.html'],
                ['watch', 'watch.html']
            ]);

            // Pages open in a new tab, so the terminal stays where it is.
            function openPage(name, url) {
                const w = window.open(url, '_blank');
                if (w) {
                    try { w.opener = null; } catch (_) {}
                    appendOutput(`→ opening ${name} in a new tab …`, 'output-line dim');
                } else {
                    // the browser blocked the popup: offer a plain link instead
                    appendOutput(`⚠️  Popup blocked. <a href="${url}" target="_blank" rel="noopener noreferrer">Open ${name}</a>`,
                        'output-line error');
                }
            }

            // ── help ──
            // [command, description, is one of the apps]
            const HELP_ITEMS = [
                ['matrix',         'Polylingual Matrix',   true],
                ['datetime',       'Decimal Clock',        true],
                ['time-converter', 'Time Converter',       true],
                ['duodecimal',     'Duodecimal Converter', true],
                ['chronograph',    'Chronograph',          true],
                ['watch',          'My dream wristwatch',  true],
                ['cat',            'Concatenate files',    false],
                ['man',            'Reference manuals',    false],
                ['touch',          'File timestamp mod',   false],
                ['uname',          'Print system name',    false],
                ['whoami',         'Print current user',   false],
                ['clear',          'Clear the terminal',   false],
                ['clr',            'Alias for clear',      false],
                ['exit',           'Close the tab',        false],
                ['help',           'Show this help',       false],
                ['pwd',            'Print working dir',    false],
                ['ls',             'List dir contents',    false],
                ['cd',             'Change dir',           false]
            ];

            // everything the autocomplete may suggest
            const COMMANDS = HELP_ITEMS.map(item => item[0]);

            function showHelp() {
                appendOutput('', '');
                appendOutput('Available commands:', 'output-line help');
                HELP_ITEMS.forEach(([name, desc, isApp]) => {
                    const row = appendOutput(
                        `  <span class="cmd-name">${name}</span>${' '.repeat(Math.max(1, 18 - name.length))}<span class="cmd-desc">${desc}</span>`,
                        'output-line help' + (isApp ? ' app' : ''));
                    row.dataset.cmd = name;
                    row.title = 'Click to type "' + name + '"';
                });
                appendOutput('', '');
            }

            // Clicking a help entry types the command into the prompt (it is not
            // run – press Enter for that).
            output.addEventListener('click', function(e) {
                const row = e.target.closest('[data-cmd]');
                if (!row) return;
                setInput(row.dataset.cmd);
            });

            // ── command logic ──
            function processCommand(cmd) {
                const trimmed = cmd.trim();

                if (trimmed === '') {
                    appendPrompt('');
                    return;
                }

                appendPrompt(trimmed);

                const lower = trimmed.toLowerCase();

                // cat (alone or with arguments)
                if (lower === 'cat' || lower.startsWith('cat ')) {
                    appendOutput('Meow', 'output-line');
                    return;
                }

                // touch (alone or with arguments)
                if (lower === 'touch' || lower.startsWith('touch ')) {
                    appendOutput('permission denied', 'output-line error');
                    return;
                }

                // uname (exact match only)
                if (lower === 'uname') {
                    appendOutput('P74', 'output-line');
                    return;
                }

                // whoami (exact match only)
                if (lower === 'whoami') {
                    appendOutput('Pouyan', 'output-line');
                    return;
                }

                // man / woman (alone or with an argument): each points at the other
                const manMatch = /^(man|woman)(?:\s+(.+))?$/i.exec(trimmed);
                if (manMatch) {
                    const other = manMatch[1].toLowerCase() === 'man' ? 'woman' : 'man';
                    const arg = manMatch[2] ? ' ' + escapeHtml(manMatch[2]) : '';
                    appendOutput(`= ${other}${arg}`, 'output-line');
                    return;
                }

                // Navigation commands – open in a new tab
                if (NAV_COMMANDS.has(lower)) {
                    openPage(lower, NAV_COMMANDS.get(lower));
                    return;
                }

                // System / easter egg commands
                switch (lower) {
                    case 'exit':
                        exitTerminal();
                        break;

                    case 'help':
                        showHelp();
                        break;

                    case 'clear':
                    case 'clr':
                        clearScreen();
                        break;

                    case 'pwd':
                        appendOutput('/ir/01001010/index', 'output-line dim');
                        break;

                    case 'ls':
                    case 'cd':
                        appendOutput('permission denied', 'output-line error');
                        break;

                    default:
                        appendOutput(`"${escapeHtml(trimmed)}": command not found`, 'output-line error');
                        break;
                }
            }

            // ── autocomplete ──
            // The first word is completed from COMMANDS. The suggestion is shown
            // dimmed after the cursor; Tab types it in full.
            function getSuggestion() {
                const v = input.value;
                if (!v || /\s/.test(v)) return '';
                if (input.selectionStart !== v.length || input.selectionEnd !== v.length) return '';
                const lv = v.toLowerCase();
                return COMMANDS.find(c => c !== lv && c.startsWith(lv)) || '';
            }

            function updateGhost() {
                const v = input.value;
                const s = getSuggestion();
                // no ghost when the text is wider than the box (input is scrolled)
                if (!s || input.scrollWidth > input.clientWidth) {
                    ghostTyped.textContent = '';
                    ghostRest.textContent = '';
                    return;
                }
                ghostTyped.textContent = v;
                ghostRest.textContent = s.slice(v.length);
            }

            // Put text in the prompt, caret at the end, ready to be executed.
            function setInput(text) {
                input.value = text;
                input.focus({ preventScroll: true });
                const end = input.value.length;
                input.setSelectionRange(end, end);
                updateGhost();
            }

            input.addEventListener('input', updateGhost);
            document.addEventListener('selectionchange', function() {
                if (document.activeElement === input) updateGhost();
            });

            // ── input handling ──
            function handleSubmit() {
                const cmd = input.value;

                if (cmd.trim() !== '') {
                    cmdHistory.push(cmd);
                }

                input.value = '';
                updateGhost();
                processCommand(cmd);
                historyIndex = cmdHistory.length;
            }

            // ── keyboard events ──
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSubmit();
                    return;
                }

                if (e.key === 'Tab' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
                    const s = getSuggestion();
                    if (s) {
                        e.preventDefault();
                        setInput(s);
                    }
                    return;
                }

                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (cmdHistory.length === 0) return;
                    if (historyIndex > 0) {
                        historyIndex--;
                        input.value = cmdHistory[historyIndex];
                    }
                    updateGhost();
                    setTimeout(() => {
                        input.selectionStart = input.selectionEnd = input.value.length;
                        updateGhost();
                    }, 0);
                    return;
                }

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (cmdHistory.length === 0) return;
                    if (historyIndex < cmdHistory.length - 1) {
                        historyIndex++;
                        input.value = cmdHistory[historyIndex];
                    } else {
                        historyIndex = cmdHistory.length;
                        input.value = '';
                    }
                    updateGhost();
                    setTimeout(() => {
                        input.selectionStart = input.selectionEnd = input.value.length;
                        updateGhost();
                    }, 0);
                    return;
                }

                // Ctrl+L / Cmd+L → clear
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l') {
                    e.preventDefault();
                    clearScreen();
                }
            });

            // ── focus management ──
            // Clicking the terminal puts the cursor in the prompt, like a real
            // terminal – except on links (so they stay usable) and while text
            // is being selected (so it can be copied). There is deliberately no
            // blur handler: forcing focus back made Tab, text selection and
            // dismissing the mobile keyboard impossible.
            terminal.addEventListener('click', function(e) {
                if (e.target.closest('a')) return;
                const sel = window.getSelection();
                if (sel && sel.toString() !== '') return;
                input.focus({ preventScroll: true });
            });

            // ── typing state (on phones: the keyboard is up) ──
            function syncTyping() {
                root.classList.toggle('typing', document.activeElement === input);
            }
            input.addEventListener('focus', syncTyping);
            input.addEventListener('blur', syncTyping);

            // ── init ──
            syncViewport();
            syncTyping();
            showWelcome();

            setTimeout(() => {
                input.focus({ preventScroll: true });
            }, 100);

            console.log('⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯');
            console.log('  P74 Tools terminal active');
            console.log('  Type "help" for commands · "clear" to clear');
            console.log('⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯');

        })();
    </script>
